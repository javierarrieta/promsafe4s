name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Scala ${{ matrix.scala }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: ["3.3.7", "2.13.18"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: sbt
      - name: Run tests
        run: sbt --batch "++ ${{ matrix.scala }};test"

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: sbt
      - name: Check formatting
        run: sbt --batch "scalafmtSbtCheck;scalafmtCheckAll"
